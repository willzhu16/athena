allowBuilds:
  esbuild: true

# qs below 6.16.0 carries three medium advisories (GHSA-4mjr-xmp4-gh2g,
# GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx) and reaches us transitively through
# @stryker-mutator/core -> typed-rest-client. Nothing here parses untrusted query strings,
# but `security / osv` gates the build and an unpatched advisory should not sit in the
# lockfile. Drop this once Stryker pulls a fixed typed-rest-client on its own.
overrides:
  qs: '>=6.16.0'
  # minimatch below 11.0.1 carries GHSA-g3hv-75wg-m249 (glob DoS) and reaches us through
  # @stryker-mutator/core 10.1.1, which asks for ~10.2.4; no 10.x release has the fix. Stryker
  # calls only Minimatch#match, #negate, #hasMagic and minimatch(), none of which 11.0 removed.
  # Pinned, not a range, so a later major cannot reach Stryker untested. Drop this once a
  # Stryker release accepts minimatch 11.
  minimatch: 11.0.5
