name: acceptance

# Every acceptance criterion in the task packet must have a passing test that claims it.
#
# review-protocol.md has always called "an acceptance criterion with no covering test" a
# blocking finding. The thing doing the finding was a human reading a diff, which is the work
# this harness exists to remove. This is that one rule, mechanised.
#
# athena checks every packet committed under packets/, which are both the record for each
# change and the worked examples. The whole directory rather than one named file: this ran
# `packets/acceptance-gate.md` while check.ps1 already read the directory, so a second packet
# added beside the first was checked locally and ignored by the gate that blocks the merge.
# A repo whose packets live in GitHub issues points the same tool at an issue body instead:
#
#   gh issue view "$PACKET" --json body --jq .body > packet.md
#   pnpm test && pnpm acceptance packet.md reports/tests.json
#
# Repo-local rather than part of platform's reusable ci.yml: it needs a packet path, which
# ci.yml has no way to know, and a `test` script that writes a JSON report.
#
# Not in rulesets/main.json, so it reports red without blocking a merge until it is added.

on:
  pull_request:
  push:
    branches: [main]

# One live run per branch: a superseded push cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # `test` writes reports/tests.json alongside its console output; acceptance reads it.
      - name: Test
        run: pnpm test
      - name: Check every criterion has a passing test
        run: pnpm acceptance packets reports/tests.json
